function editProperty(cim){const p=prop(cim);modal(`Imóvel · CIM ${p.cim}`,`<div class="actions" style="margin-bottom:15px">${status(p)}<button id="locate">Localizar no mapa</button><button id="printProperty">Imprimir ficha</button></div><div class="notice">As alterações feitas aqui são locais. Na próxima importação você poderá revisar o que mudou antes de atualizar.</div><form id="propertyForm"><div class="grid">${Object.entries(FIELDS).filter(([k])=>k!=='historico_transferencias').map(([k,label])=>`<label class="field">${label}${['observacoes','historico_transferencias','observacoes_origem'].includes(k)?`<textarea data-field="${k}" rows="3">${esc(p[k])}</textarea>`:`<input data-field="${k}" value="${esc(p[k])}" ${k==='cim'?'readonly':''}>`}</label>`).join('')}</div><div class="actions" style="margin-top:18px"><button type="submit" class="primary">Salvar alterações</button><span class="sub">CIM permanente · não editável</span></div></form><h3 class="section">Fotos do imóvel</h3><div class="photos">${(p.photos||[]).map((f,i)=>`<div class="photo"><a href="${f.data}" download="${esc(f.name)}"><img src="${f.data}" alt="${esc(f.name)}"></a><button data-remove-photo="${i}" aria-label="Remover foto">×</button></div>`).join('')||'<p class="sub">Nenhuma foto adicionada.</p>'}</div><label class="field" style="margin-top:15px">Adicionar fotos (até 5 MB por arquivo)<input type="file" id="photos" multiple accept="image/png,image/jpeg,image/webp"></label><h3 class="section">Histórico do imóvel — sistema de origem</h3><p class="sub">Eventos preservados do relatório, em ordem cronológica. Não alteram o proprietário cadastral nem a situação do imóvel.</p>${historicalHtml(cim)}${p.historico_transferencias?'<p>'+esc(p.historico_transferencias)+'</p>':''}<h3 class="section">Alterações neste sistema</h3>${historyHtml(state.history.filter(h=>h.cim===cim))}`);
$('#propertyForm').onsubmit=async e=>{e.preventDefault();const changed={};$('#propertyForm').querySelectorAll('[data-field]').forEach(i=>{if(i.dataset.field!=='cim'&&val(p[i.dataset.field])!==i.value.trim())changed[i.dataset.field]=i.value.trim()});if(!Object.keys(changed).length){toast('Nenhuma alteração.');return}if((changed.quadra!==undefined||changed.lote!==undefined)&&state.lots.some(l=>l.cim===cim)){toast('Remova ou revise o contorno antes de alterar a quadra ou o lote de um imóvel demarcado.');return}const changes=Object.entries(changed).map(([k,v])=>`${FIELDS[k]}: ${val(p[k])||'(vazio)'} → ${v||'(vazio)'}`).join('\n');await commit(()=>{Object.assign(prop(cim),changed);if(prop(cim).provisional&&isComplete(prop(cim)))prop(cim).provisional=false;log('Edição local',cim,changes)});editProperty(cim);render();toast('Cadastro atualizado.')};$('#locate').onclick=()=>{const l=state.lots.find(l=>l.cim===cim);if(!l){toast('Este imóvel ainda não tem demarcação.');return}closeModal();page='map';mapLayer=shapeSpace(block(l.blockId))==='geo'?'satellite':'local';state.mapLayer=mapLayer;selectedBlock=l.blockId;selectedCim=cim;const a=l.points,x=a.map(p=>p[0]),y=a.map(p=>p[1]);camera={x:Math.min(...x)-50,y:Math.min(...y)-50,w:Math.max(...x)-Math.min(...x)+100,h:Math.max(...y)-Math.min(...y)+100};render()};$('#printProperty').onclick=()=>printProperty(p);$('#photos').onchange=async e=>{const files=[...e.target.files];if(files.some(f=>f.size>5*1024*1024||!['image/png','image/jpeg','image/webp'].includes(f.type))){toast('Use PNG, JPEG ou WebP de até 5 MB por foto.');return}try{const images=[];for(const f of files){const data=await fileData(f);await imageSize(data);images.push({name:f.name,data})}await commit(()=>{prop(cim).photos.push(...images);log('Fotos',cim,`${images.length} foto(s) adicionada(s).`)});editProperty(cim)}catch(e){toast('Falha ao adicionar fotos: '+e.message)}};$('#dialogBody').querySelectorAll('[data-remove-photo]').forEach(b=>b.onclick=async()=>{if(!confirm('Remover esta foto?'))return;await commit(()=>{prop(cim).photos.splice(Number(b.dataset.removePhoto),1);log('Fotos',cim,'Foto removida.')});editProperty(cim)})}
function historyHtml(rows){return rows.slice(0,300).map(h=>`<div class="timeline"><small>${date(h.at)} · ${esc(h.type)}${h.cim?' · CIM '+esc(h.cim):''}</small><p>${esc(h.description)}</p></div>`).join('')||'<p class="sub">Nenhuma alteração registrada.</p>'}
function renderHistory(){$('#main').innerHTML=header('Histórico do imóvel','Histórico da origem separado das alterações feitas neste sistema')+`<div class="searchrow history-search"><input id="historySearch" placeholder="Filtrar pelo CIM (ex.: 200)" value="${esc(filter)}"><button id="historyFilter">Filtrar</button><button id="historyExport">Exportar histórico da origem</button></div><div class="history-columns"><section class="card history-origin"><span class="section-label">TRANSFERÊNCIAS E OCORRÊNCIAS</span><h2>Histórico do sistema de origem</h2><p class="sub">${state.originHistory.filter(e=>!filter||e.cim===norm(filter)).length} eventos · ordem cronológica · conteúdo preservado do PDF</p>${historicalHtml(filter?norm(filter):null)}</section><aside class="card history-local"><span class="section-label">ATIVIDADE LOCAL</span><h2>Alterações neste sistema</h2>${historyHtml(state.history.filter(h=>!filter||h.cim===norm(filter)))}<p class="sub">Até 300 eventos locais mais recentes. O backup contém todos os eventos.</p></aside></div>`;$('#historyFilter').onclick=()=>{filter=$('#historySearch').value.trim();renderHistory()};$('#historySearch').onkeydown=e=>{if(e.key==='Enter')$('#historyFilter').click()};$('#historyExport').onclick=()=>exportHistorical(state.originHistory.filter(e=>!filter||e.cim===norm(filter)))}

function renderAlerts(){const d=diagnostics();$('#main').innerHTML=header('Pendências e conferência','Inconsistências são preservadas para revisão; nenhum imóvel é unido automaticamente')+`<div class="notice">As conferências são calculadas a partir dos dados importados. Cadastros repetidos permanecem separados pelo CIM; nenhum imóvel é unido automaticamente.</div><div class="diagnostic-grid">`+[['provisional','Cadastros incompletos vindos do histórico',d.provisional.length,'Registros apenas com CIM e histórico. Uma nova importação preenche os dados no mesmo cadastro.'],['quadra','Quadra e lote repetidos',d.quadra.length,'Comparação ignora zeros à esquerda. São candidatos à conferência, sem pressupor a causa.'],['inscricao','Inscrições repetidas',d.inscricao.length,'Cadastros mantidos separados pelo CIM.'],['missing','Quadra ou lote ausentes',d.missing.length,'Complete a identificação antes de vincular uma demarcação.'],['unmapped','Imóveis sem demarcação',d.unmapped.length,'A localização deve ser desenhada e vinculada manualmente.']].map(([key,title,count,sub])=>`<div class="card alertitem"><div class="count">${fmt(count)}</div><div style="flex:1"><strong>${title}</strong><p>${sub}</p></div><button data-diagnostic="${key}">Conferir</button></div>`).join('')+`</div><h2 class="list-heading">Pendências de importação e revisão</h2>${state.notices.filter(n=>!n.resolved).map(n=>`<div class="card"><strong>${esc(n.title)}</strong><p>${esc(n.message)}</p><p class="sub">${date(n.at)}${n.cim?' · CIM '+esc(n.cim):''}</p><div class="actions">${n.cim&&prop(n.cim)?`<button data-details="${esc(n.cim)}">Abrir imóvel</button>`:''}<button data-resolve="${n.id}">Marcar como conferido</button></div></div>`).join('')||'<div class="card muted">Nenhuma pendência de importação em aberto.</div>'}`;$('#main').querySelectorAll('[data-diagnostic]').forEach(b=>b.onclick=()=>showDiagnostic(b.dataset.diagnostic));$('#main').querySelectorAll('[data-resolve]').forEach(b=>b.onclick=async()=>{await commit(()=>{const n=state.notices.find(n=>n.id===b.dataset.resolve);n.resolved=true;log('Conferência',n.cim||'',n.title+' — marcado como conferido.')});renderAlerts()});wireDetails($('#main'))}
function showDiagnostic(key){const d=diagnostics(),g=d[key];const rows=key==='quadra'||key==='inscricao'?g.flat():g;modal('Conferência cadastral',`<p>${fmt(rows.length)} registros. Os valores originais foram preservados.</p><button id="diagCsv">Exportar conferência</button><div class="tablewrap" style="margin-top:15px">${table(rows.slice(0,150))}</div>${rows.length>150?'<p class="sub">Primeiros 150 registros. A exportação contém todos.</p>':''}`);$('#diagCsv').onclick=()=>exportCsv(rows);wireDetails($('#dialogBody'))}
function download(name,data,type='application/json'){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function exportCsv(rows){const keys=Object.keys(FIELDS),safe=v=>{let s=val(v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download('BIQMapa-Imoveis-'+new Date().toISOString().slice(0,10)+'.csv','\ufeff'+[keys.map(k=>safe(FIELDS[k])).join(';'),...rows.map(p=>keys.map(k=>safe(p[k])).join(';'))].join('\r\n'),'text/csv;charset=utf-8')}
function printRows(rows,title){$('#report').innerHTML=`<h1>Prefeitura Municipal de Biquinhas</h1><p>Tributos e Engenharia · ${esc(title)} · ${date(now())}</p>${table(rows).replace(/<button[^>]*>Detalhes<\/button>/g,'')}`;window.print()}
function printProperty(p){$('#report').innerHTML=`<h1>Ficha de conferência · CIM ${esc(p.cim)}</h1><p>Prefeitura Municipal de Biquinhas · ${date(now())}</p><table>${Object.entries(FIELDS).map(([k,l])=>`<tr><th>${l}</th><td>${esc(p[k])}</td></tr>`).join('')}</table>`;window.print()}
function printMap(){const base=$('#basemapSvg'),overlay=$('#svg');$('#report').innerHTML=`<h1>Mapa de referência · Biquinhas</h1><p>${date(now())} · Sem precisão cadastral · ${$('#mapCredit')?.textContent||'Mapa de referência'}</p><svg class="mapprint" xmlns="http://www.w3.org/2000/svg" viewBox="${camera.x} ${camera.y} ${camera.w} ${camera.h}">${base?base.innerHTML:''}${overlay.innerHTML}</svg>`;window.print()}

function renderImports(){$('#main').innerHTML=header('Importar e atualizar','Reconhecimento pelo CIM permanente · revisão antes de aplicar')+`<div class="workflow-steps"><div><b>01</b><span>Selecionar arquivo</span></div><div><b>02</b><span>Conferir diferenças</span></div><div><b>03</b><span>Aplicar atualização</span></div></div><div class="import-layout"><section class="card import-workspace"><span class="section-label">ATUALIZAÇÃO DO ACERVO</span><h2>Arquivo de imóveis</h2><p>Selecione seu arquivo JSON de imóveis (.json), o mesmo arquivo já utilizado no setor, ou CSV separado por ponto e vírgula ou vírgula. Não é necessário instalar ou abrir outro sistema. Use cabeçalhos do formato atual ou os nomes dos campos exibidos no cadastro. PDF e Excel precisam ser convertidos antes de importar.</p><label class="upload-zone"><span class="upload-symbol" aria-hidden="true">↥</span><strong>Selecione o relatório para conferência</strong><span>Arquivos JSON ou CSV</span><input type="file" id="importFile" accept=".json,.csv"></label><label class="check"><input type="checkbox" id="complete">Este arquivo é um relatório completo de todos os imóveis</label><p class="sub">Somente relatórios completos geram avisos para CIMs ausentes. Ausência nunca exclui automaticamente. Colunas ou células vazias preservam dados já preenchidos.</p><p class="sub">Exclusão só é reconhecida por um campo explícito: status/situação = “excluído” ou “excluído logicamente”, ou excluido = sim/true/1. Situações desconhecidas são sinalizadas.</p><button class="primary" id="reviewImport">Analisar arquivo →</button></section><aside class="import-guide"><span class="section-label">ANTES DE IMPORTAR</span><h2>Uma atualização por vez.</h2><p>O relatório é comparado com os cadastros existentes antes de alterar qualquer informação.</p><ol><li><b>Identificação pelo CIM</b><span>O mesmo imóvel recebe os dados atualizados.</span></li><li><b>Revisão das diferenças</b><span>Você confere o que mudou antes de aplicar.</span></li><li><b>Histórico preservado</b><span>As mudanças ficam registradas para consulta.</span></li></ol></aside></div><div id="importPreview"></div>`;$('#reviewImport').onclick=reviewImport}
const alias={proprietario:'nome',contribuinte:'nome',inscricao_imobiliaria:'inscricao',codigo_do_proprietario:'codigo_contribuinte',codigo_proprietario:'codigo_contribuinte',codigo_contribuinte:'codigo_contribuinte',cpf_cnpj:'cpf_cnpj',numero:'numero',testada_m:'testada',area_do_terreno_m2:'area_total',area_do_terreno_total_m2:'area_total',area_do_terreno:'area_total',area_territorial:'area_total',area_construida_m2:'area_construida',situacao:'status'};
function keyNorm(k){return k.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/²/g,'2').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}
function parseCsv(text){const first=text.split(/\r?\n/)[0],sep=first.includes(';')?';':',';let rows=[],row=[],s='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){s+='"';i++}else quote=!quote}else if(c===sep&&!quote){row.push(s);s=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(s);if(row.some(x=>x.trim()))rows.push(row);row=[];s=''}else s+=c}if(quote)throw Error('CSV com aspas não fechadas.');row.push(s);if(row.some(x=>x.trim()))rows.push(row);if(!rows.length)return [];const headers=rows.shift().map(h=>h.replace(/^\ufeff/,'').trim());if(new Set(headers).size!==headers.length)throw Error('CSV com cabeçalhos repetidos.');if(rows.some(r=>r.length!==headers.length))throw Error('CSV com quantidade de colunas inconsistente.');return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]])))}
for(const [k,label]of Object.entries(FIELDS))alias[keyNorm(label)]=k;
function normalizeImport(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Registro inválido.');const r={};for(const [key,v]of Object.entries(raw)){let k=keyNorm(key);k=alias[k]||k;if(Object.hasOwn(FIELDS,k)||['status','excluido'].includes(k)){if(v!==null&&typeof v==='object')throw Error('Campo não textual: '+k);r[k]=val(v).trim()}}if(!r.cim)throw Error('Há registro sem CIM.');r.cim=norm(r.cim);return r}
function importStatus(r){if(Object.hasOwn(r,'excluido')&&r.excluido!==''){const v=norm(r.excluido);if(['SIM','TRUE','1'].includes(v))return 'excluido';if(['NAO','NÃO','FALSE','0'].includes(v))return 'ativo';return 'desconhecido'}if(r.status){const v=keyNorm(r.status);if(['excluido','excluido_logicamente','exclusao_logica'].includes(v))return 'excluido';if(['ativo','ativa'].includes(v))return 'ativo';return 'desconhecido'}return null}
function planImport(rows,complete){const seen=new Set,dups=[];for(const r of rows){if(seen.has(r.cim))dups.push(r.cim);seen.add(r.cim)}if(dups.length)throw Error('Importação bloqueada: CIM repetido no arquivo ('+[...new Set(dups)].slice(0,10).join(', ')+').');const plan={added:[],updated:[],missing:[],unknown:[],unchanged:0,complete};for(const r of rows){const p=prop(r.cim),st=importStatus(r);if(st==='desconhecido')plan.unknown.push(r.cim);if(!p){plan.added.push({...Object.fromEntries(Object.keys(FIELDS).map(k=>[k,''])),...Object.fromEntries(Object.entries(r).filter(([k])=>Object.hasOwn(FIELDS,k))),status:st&&st!=='desconhecido'?st:'nao_informado',photos:[],provisional:false});continue}const changes={};for(const [k,v]of Object.entries(r))if(k!=='cim'&&Object.hasOwn(FIELDS,k)&&v!==''&&val(p[k])!==v)changes[k]=v;if(st&&st!=='desconhecido'&&p.status!==st)changes.status=st;if(Object.keys(changes).length)plan.updated.push({cim:r.cim,changes});else plan.unchanged++}if(complete)plan.missing=state.properties.filter(p=>!seen.has(norm(p.cim))).map(p=>p.cim);return plan}
async function reviewImport(){const f=$('#importFile').files[0];if(!f){toast('Selecione o arquivo.');return}if(f.size>30*1024*1024){toast('Arquivo maior que 30 MB.');return}try{let raw=await f.text();raw=raw.replace(/^\ufeff/,'');const data=f.name.toLowerCase().endsWith('.csv')?parseCsv(raw):JSON.parse(raw);const rows=Array.isArray(data)?data:data.properties;if(!Array.isArray(rows)||!rows.length)throw Error('Arquivo sem imóveis.');pendingImport=planImport(rows.map(normalizeImport),$('#complete').checked);pendingImport.name=f.name;showImportPreview()}catch(e){pendingImport=null;$('#importPreview').innerHTML='';toast(e.message)}}
function showImportPreview(){const p=pendingImport;$('#importPreview').innerHTML=`<div class="card"><h2>Prévia · ${esc(p.name)}</h2><p><strong>${p.added.length}</strong> novos · <strong>${p.updated.length}</strong> alterados · <strong>${p.unchanged}</strong> sem mudança · <strong>${p.missing.length}</strong> ausentes</p><div class="notice">Os valores não informados serão preservados. ${p.complete?'CIMs ausentes gerarão avisos, sem excluir cadastros.':'Relatório parcial: não serão procurados imóveis ausentes.'} ${p.unknown.length?p.unknown.length+' situação(ões) desconhecida(s) gerarão avisos.':''}</div><div style="max-height:350px;overflow:auto">${p.updated.map(u=>`<div class="timeline"><strong>CIM ${esc(u.cim)}</strong>${Object.entries(u.changes).map(([k,v])=>`<p>${esc(FIELDS[k]||k)}: ${esc(prop(u.cim)[k])||'(vazio)'} → ${esc(v)}</p>`).join('')}</div>`).join('')}${p.added.map(r=>`<p>Novo CIM ${esc(r.cim)} · ${esc(r.nome)}</p>`).join('')}</div><button id="applyImport" class="primary">Aplicar atualização revisada</button><button id="cancelImport">Cancelar</button></div>`;$('#applyImport').onclick=applyImport;$('#cancelImport').onclick=()=>{pendingImport=null;$('#importPreview').innerHTML=''}}
function notice(title,cim,message){if(!state.notices.some(n=>!n.resolved&&n.title===title&&n.cim===cim))state.notices.unshift({id:uid(),title,cim,message,at:now(),resolved:false})}
async function applyImport(){if(!pendingImport)return;const plan=pendingImport;$('#applyImport').disabled=true;try{await commit(()=>{for(const r of plan.added){state.properties.push(r);log('Importação',r.cim,'Cadastro incluído a partir de '+plan.name);notice('Novo imóvel sem demarcação',r.cim,'Confira o cadastro e desenhe o lote quando necessário.')}for(const u of plan.updated){const p=prop(u.cim),old={...p};Object.assign(p,u.changes);if(p.provisional&&isComplete(p)){p.provisional=false;state.notices.filter(n=>n.cim===p.cim&&n.title==='Cadastro incompleto — localizado no histórico').forEach(n=>n.resolved=true)}log('Importação',p.cim,Object.entries(u.changes).map(([k,v])=>`${FIELDS[k]||k}: ${val(old[k])||'(vazio)'} → ${v}`).join('\n'));if(u.changes.status==='excluido')notice('Imóvel excluído na origem',p.cim,'O cadastro e o contorno foram mantidos. Confira se houve desdobro ou outra alteração.');if((u.changes.quadra!==undefined||u.changes.lote!==undefined)&&state.lots.some(l=>l.cim===p.cim))notice('Revisar demarcação após alteração cadastral',p.cim,'Quadra ou lote mudaram na origem. O contorno anterior foi preservado para revisão.')}for(const cim of plan.missing)notice('CIM ausente no relatório completo',cim,'Não houve exclusão automática. Confira a origem e a necessidade de novas demarcações.');for(const cim of plan.unknown)notice('Situação não reconhecida na origem',cim,'O estado anterior foi preservado. Confira o significado da situação no relatório.');log('Importação','',`${plan.name}: ${plan.added.length} novos, ${plan.updated.length} alterados, ${plan.unchanged} sem mudança, ${plan.missing.length} ausentes.`)});pendingImport=null;renderImports();toast('Atualização aplicada. Confira as pendências.')}catch(e){toast(e.message);$('#applyImport').disabled=false}}
function renderBackup(){$('#main').innerHTML=header('Backup e restauração','Cadastros, desenhos, fotos e histórico ficam salvos neste computador')+`<div class="notice">A base é salva automaticamente no banco local do BIQMapa, separado da pasta de instalação. Atualizar o aplicativo preserva os dados. O backup exportado permite transferir o trabalho para outro computador.</div><div class="backup-grid"><section class="card backup-save"><span class="section-label">PROTEGER O TRABALHO</span><div class="backup-symbol" aria-hidden="true">↓</div><h2>Salvar uma cópia completa</h2><p>Exporte um backup antes de importar um novo relatório ou encerrar um dia de trabalho. Guarde outra cópia fora deste computador.</p><button id="backupExport" class="primary">Exportar backup completo →</button></section><section class="card backup-restore"><span class="section-label">RECUPERAR UMA BASE</span><div class="backup-symbol" aria-hidden="true">↥</div><h2>Restaurar uma cópia</h2><p>A restauração substitui os dados atuais. Exporte um backup antes de restaurar outro arquivo. Backups da versão HTML 0.7.0 também são aceitos.</p><input type="file" id="backupFile" accept=".json"><button id="backupRestore">Conferir backup para restaurar</button></section></div><details class="card technical-notes"><summary>Armazenamento e funcionamento do mapa</summary><p>O aplicativo inicia sem imóveis. Importe seu arquivo JSON de imóveis em Configurações → Importar dados. A identificação permanente é o CIM. Relatórios não fazem exclusões automáticas.</p><p>Apenas o satélite depende de internet. Os dados dos imóveis não são enviados ao provedor. O mapa de ruas de Biquinhas está incluído e funciona offline. A imagem local 4K é preparada com internet uma vez e depois fica salva no computador e nos backups JSON, com a mesma referência das quadras e lotes.</p><p>Uma cópia local do banco é criada antes da primeira alteração de cada dia. As últimas 30 cópias ficam na pasta backups, junto aos dados. Elas não substituem uma cópia externa. O histórico registra alterações locais e importações, mas não é uma trilha de auditoria inviolável.</p><p id="dataDirectory" class="sub"></p></details>`;desktopApi.environment(raw=>{try{$('#dataDirectory').textContent='Pasta de dados: '+JSON.parse(raw).directory}catch{}});$('#backupExport').onclick=()=>{download('BIQMapa-Backup-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json',JSON.stringify({format:'biqmapa-backup',version:1,exported:now(),state}));toast('Escolha onde salvar o backup.')};$('#backupRestore').onclick=restoreBackup}

function validateState(s){if(!s||!Array.isArray(s.originHistory)||s.version!==1||!Array.isArray(s.properties)||!Array.isArray(s.blocks)||!Array.isArray(s.lots)||!Array.isArray(s.history)||!Array.isArray(s.notices))throw Error('Estrutura de backup inválida.');if(s.offlineMap&&!validOfflineMap(s.offlineMap))throw Error('A imagem local do backup usa outra referência ou está inválida.');const ids=new Set;for(const p of s.properties){if(!p||typeof p.cim!=='string'||!p.cim||ids.has(p.cim)||!Array.isArray(p.photos))throw Error('Cadastro inválido ou CIM duplicado no backup.');ids.add(p.cim);for(const k of Object.keys(FIELDS))if(p[k]!==undefined&&p[k]!==null&&!['string','number'].includes(typeof p[k]))throw Error('Campo inválido no backup.');for(const f of p.photos)if(!f||typeof f.name!=='string'||!isDataImage(f.data))throw Error('Foto inválida.')}for(const e of s.originHistory){if(!e||typeof e.id!=='string'||typeof e.cim!=='string'||!/^\d+$/.test(e.cim)||typeof e.date!=='string'||!Number.isFinite(e.page))throw Error('Histórico de origem inválido.');for(const k of ['title','from_owner','to_owner','description1','description2','source','code','user'])if(typeof e[k]!=='string')throw Error('Histórico de origem inválido.')}if(s.lots.some(l=>s.blocks.find(b=>b.id===l.blockId)?.space==='geo')||s.blocks.some(b=>b.space==='geo')){const g=s.geoReference;if(!g||g.version!==1||g.baseZoom!==GEO.baseZoom||!Array.isArray(g.origin)||g.origin.length!==2||g.origin.some((v,i)=>!Number.isFinite(v)||Math.abs(v-GEO.origin[i])>1e-6))throw Error('O backup usa outra referência geográfica. Restaure com a versão correspondente para não deslocar os contornos.')}const validId=v=>typeof v==='string'&&/^[a-zA-Z0-9-]{1,80}$/.test(v);const bid=new Set,nums=new Set,lids=new Set,linked=new Set;for(const b of s.blocks){if(!b||!validId(b.id)||bid.has(b.id)||typeof b.number!=='string'||nums.has((b.space||'local')+'|'+norm(b.number))||!validPoints(b.points)||(b.space!==undefined&&!['geo','local'].includes(b.spac function validPoints(p){return Array.isArray(p)&&p.every(v=>Array.isArray(v)&&v.length===2&&v.every(Number.isFinite))&&validPolygon(p)}function isDataImage(s){return typeof s==='string'&&/^data:image\/(png|jpeg|webp);base64,[a-zA-Z0-9+/=\s]+$/.test(s)}
async function restoreBackup(){const f=$('#backupFile').files[0];if(!f)return toast('Selecione o backup.');try{const b=JSON.parse(await f.text());if(b.format!=='biqmapa-backup'||b.version!==1)throw Error('Arquivo não é um backup do BIQMapa.');validateState(b.state);if(!confirm(`Restaurar ${b.state.properties.length} imóveis e ${b.state.lots.length} lotes? Os dados locais atuais serão substituídos. Exporte o backup atual antes de continuar.`))return;await commit(()=>{state=b.state;log('Restauração','',`Backup restaurado: ${f.name}`)});selectedBlock=null;selectedCim=null;configureMap();renderBackup();toast('Backup restaurado.')}catch(e){toast('Restauração recusada: '+e.message)}}
$('#help').onclick=()=>modal('Como começar',`<p><strong>1.</strong> Em Configurações → Importar dados, selecione seu arquivo JSON de imóveis (.json), o mesmo que você já utilizou no setor. Confira a prévia antes de aplicar. O aplicativo inicia sem cadastros.</p><p><strong>2.</strong> O mapa abre em Biquinhas. Satélite usa internet; Ruas funciona offline. Aumentar o zoom não cria detalhes além da imagem disponível.</p><p><strong>3.</strong> Desenhe a quadra e depois seus lotes. O contorno fecha no primeiro ponto. Espaço + arrastar ou botão direito move o mapa durante o desenho.</p><p><strong>4.</strong> Escolha cada imóvel pelo CIM. Quadra/lote repetidos geram aviso, mas não bloqueiam a vinculação. Clique no lote para consultar a ficha.</p><p><strong>5.</strong> Exporte backups regularmente. Os dados ficam no computador e são preservados nas atualizações do programa. Para continuar desenhos feitos no protótipo, restaure o backup JSON da versão 0.7.0.</p><div class="notice">As demarcações servem para localização e referência visual. Não substituem levantamento técnico.</div>`);

const unavailableTiles=new Map();

function validOfflineMap(image){const r=image?.reference,e=image?.extent;if(!(image?.version===1&&isDataImage(image.data)&&image.width===4096&&Number.isFinite(image.height)&&image.height>0&&image.height<=4096&&r?.baseZoom===GEO.baseZoom&&r.width===GEO.width&&r.height===GEO.height&&Array.isArray(r.origin)&&r.origin.length===2&&r.origin.every((v,i)=>Number.isFinite(v)&&Math.abs(v-GEO.origin[i])<1e-6)&&e?.spatialReference&&[3857,102100].includes(e.spatialReference.latestWkid||e.spatialReference.wkid)&&['xmin','ymin','xmax','ymax'].every(k=>Number.isFinite(e[k]))&&e.xmax>e.xmin&&e.ymax>e.ymin&&typeof image.credit==='string'&&image.credit.length>0&&/^[a-f0-9]{64}$/.test(image.sha256)))return false;const box=offlineMapBox(image);return Math.abs(box.x)<5&&Math.abs(box.y)<5&&Math.abs(box.w-GEO.width)<12&&Math.abs(box.h-GEO.height)<12}

async function prepareOfflineMap(activate=false,refresh=false){if(validOfflineMap(state.offlineMap)&&!refresh){if(activate)await activateOfflineMap();return state.offlineMap}if(!offlinePreparation){offlinePreparation=(async()=>{const button=$('#imageBtn');if(button){button.textContent='Preparando imagem 4K…';button.setAttribute('aria-busy','true')}await desktopCall('prepare_offline_map',refresh);let image;for(let attempt=0;attempt<240;attempt++){const result=await desktopCall('offline_map_status');if(result.ready){image=result.image;break}await new Promise(resolve=>setTimeout(resolve,500))}if(!validOfflineMap(image))throw Error('Não foi possível validar a base local de Biquinhas.');while(busy)await new Promise(resolve=>setTimeout(resolve,200));await commit(()=>{state.offlineMap=image;log('Mapa','','Imagem local 4K preparada e alinhada ao mapa geográfico.')});return image})().finally(()=>{offlinePreparation=null;const button=$('#imageBtn');if(button){button.textContent='Imagem local';button.setAttribute('aria-busy','false')}})}const image=await offlinePreparation;if(activate)await activateOfflineMap();else if(page==='map')drawSvg();return image}
